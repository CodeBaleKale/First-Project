name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snapcal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Keep a rolling "apk-latest" release so the newest APK is always one tap
      # away on a phone: github.com/<repo>/releases/tag/apk-latest
      - name: Publish APK to rolling release
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SnapCal-debug.apk
          gh release create apk-latest --prerelease \
            --title "SnapCal APK (latest build)" \
            --notes "Debug APK auto-built from the latest commit. Download SnapCal-debug.apk on your phone, open it, and allow installing from this source." \
            || true
          gh release upload apk-latest SnapCal-debug.apk --clobber
